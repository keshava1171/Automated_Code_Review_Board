<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="#f8fafc" />

  <!-- Header -->
  <text x="500" y="42" text-anchor="middle" class="title">AUTOMATED CODE REVIEW BOARD — MULTI-AGENT ARCHITECTURE</text>
  <text x="500" y="66" text-anchor="middle" class="subtitle">CSE476 CA2 Project Q14 | Framework: Microsoft Semantic Kernel | Pattern: Fan-Out / Fan-In</text>

  <!-- 1. Input: Git Diff -->
  <rect x="390" y="90" width="220" height="48" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="500" y="112" text-anchor="middle" class="box-title" fill="#0f172a">Raw Pull Request Diff</text>
  <text x="500" y="128" text-anchor="middle" class="box-desc">Git patch containing code modifications</text>

  <!-- Arrow to Diff Agent -->
  <line x1="500" y1="138" x2="500" y2="168" class="arrow" />

  <!-- 2. Diff Agent -->
  <rect x="360" y="170" width="280" height="74" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
  <rect x="375" y="180" width="75" height="18" rx="4" fill="#0284c7" />
  <text x="412" y="193" text-anchor="middle" class="badge-text">AGENT 1</text>
  <text x="520" y="194" class="box-title" fill="#0369a1">Diff Agent (Ingestion)</text>
  <text x="375" y="216" class="box-desc">• Tool 1: parse_git_diff() [files, additions, deletions]</text>
  <text x="375" y="232" class="box-desc">• Tool 2: extract_touched_components() [AST parser]</text>

  <!-- Fan-out Split Line -->
  <line x1="500" y1="244" x2="500" y2="280" class="arrow" />
  <path d="M 180 280 L 820 280" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
  <text x="500" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">CONCURRENT FAN-OUT PHASE (ThreadPoolExecutor)</text>

  <line x1="180" y1="280" x2="180" y2="310" class="arrow" />
  <line x1="500" y1="280" x2="500" y2="310" class="arrow" />
  <line x1="820" y1="280" x2="820" y2="310" class="arrow" />

  <!-- 3. Parallel Agents -->
  <!-- Style Agent -->
  <rect x="50" y="312" width="260" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <rect x="65" y="322" width="75" height="18" rx="4" fill="#d97706" />
  <text x="102" y="335" text-anchor="middle" class="badge-text">AGENT 2</text>
  <text x="150" y="336" class="box-title" fill="#b45309">Style Agent</text>
  <text x="65" y="360" class="box-desc">• Tool 1: inspect_naming_conventions()</text>
  <text x="75" y="375" class="box-desc">(Checks PEP8 snake_case & camelCase)</text>
  <text x="65" y="395" class="box-desc">• Tool 2: check_formatting_and_comments()</text>
  <text x="75" y="410" class="box-desc">(Flags >100 chars & raw print() calls)</text>

  <!-- Security Agent -->
  <rect x="370" y="312" width="260" height="110" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#shadow)" />
  <rect x="385" y="322" width="75" height="18" rx="4" fill="#e11d48" />
  <text x="422" y="335" text-anchor="middle" class="badge-text">AGENT 3</text>
  <text x="470" y="336" class="box-title" fill="#be123c">Security Agent</text>
  <text x="385" y="360" class="box-desc">• Tool 1: scan_hardcoded_secrets()</text>
  <text x="395" y="375" class="box-desc">(Audits AWS keys, PAT tokens, passwords)</text>
  <text x="385" y="395" class="box-desc">• Tool 2: scan_vulnerable_execution_patterns()</text>
  <text x="395" y="410" class="box-desc">(Flags eval(), SQL Injection, shell=True)</text>

  <!-- Test Coverage Agent -->
  <rect x="690" y="312" width="260" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
  <rect x="705" y="322" width="75" height="18" rx="4" fill="#059669" />
  <text x="742" y="335" text-anchor="middle" class="badge-text">AGENT 4</text>
  <text x="790" y="336" class="box-title" fill="#047857">Test-Coverage Agent</text>
  <text x="705" y="360" class="box-desc">• Tool 1: verify_test_file_pairing()</text>
  <text x="715" y="375" class="box-desc">(Ensures code changes touch test files)</text>
  <text x="705" y="395" class="box-desc">• Tool 2: inspect_assertion_quality()</text>
  <text x="715" y="410" class="box-desc">(Checks for empty mocks vs real asserts)</text>

  <!-- Fan-In Line -->
  <line x1="180" y1="422" x2="180" y2="455" class="arrow" />
  <line x1="500" y1="422" x2="500" y2="455" class="arrow" />
  <line x1="820" y1="422" x2="820" y2="455" class="arrow" />
  <path d="M 180 455 L 820 455" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" />
  <text x="500" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">FAN-IN AGGREGATION & SEVERITY RANKING</text>
  <line x1="500" y1="455" x2="500" y2="480" class="arrow" />

  <!-- 4. Reviewer Manager -->
  <rect x="330" y="482" width="340" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" />
  <rect x="345" y="492" width="75" height="18" rx="4" fill="#7c3aed" />
  <text x="382" y="505" text-anchor="middle" class="badge-text">AGENT 5</text>
  <text x="435" y="506" class="box-title" fill="#6d28d9">Reviewer Manager (Gatekeeper)</text>
  <text x="345" y="528" class="box-desc">• Tool 1: deduplicate_and_rank_findings() [CRITICAL > HIGH > MED > LOW]</text>
  <text x="345" y="546" class="box-desc">• Tool 2: evaluate_merge_policy() [Blocks merge if Critical/High exists]</text>

  <!-- Split to Outputs -->
  <line x1="420" y1="562" x2="250" y2="595" class="arrow" />
  <line x1="580" y1="562" x2="740" y2="595" class="arrow" />

  <!-- 5. Decision Output -->
  <rect x="90" y="595" width="320" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="250" y="620" text-anchor="middle" class="box-title" fill="#065f46">Consolidated Merge Decision</text>
  <text x="250" y="638" text-anchor="middle" class="box-desc">APPROVE (Clean/Advisories) or REQUEST_CHANGES</text>

  <!-- 6. Fix Suggestion Agent (Group of 3 Extension) -->
  <rect x="580" y="595" width="330" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <rect x="595" y="605" width="75" height="18" rx="4" fill="#2563eb" />
  <text x="632" y="618" text-anchor="middle" class="badge-text">AGENT 6</text>
  <text x="680" y="619" class="box-title" fill="#1d4ed8">Fix-Suggestion Agent</text>
  <text x="595" y="640" class="box-desc">Synthesizes concrete unified git patch for top blocker</text>

</svg>
